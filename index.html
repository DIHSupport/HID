<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Income Hub - Telegram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0e1217;
            background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 0);
            background-size: 24px 24px;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Telegram Header Bar */
        .header {
            width: 100%;
            background-color: #1c2229;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #111519;
        }

        .tg-logo-circle {
            width: 34px;
            height: 34px;
            background-color: #2AABEE;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }

        .tg-logo-circle svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
            margin-left: -2px;
        }

        .header-title {
            font-size: 19px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        /* Main Center Card */
        .card-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
        }

        .card {
            background-color: #1c2229;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 36px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Profile Image Container */
        .profile-wrapper {
            width: 126px;
            height: 126px;
            margin: 0 auto 20px auto;
            position: relative;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            box-shadow: 0 0 15px rgba(255, 200, 0, 0.25);
        }

        /* Channel Title */
        .channel-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        /* Subscribers Count */
        .subscribers {
            font-size: 15px;
            color: #7d8b99;
            margin-bottom: 22px;
        }

        /* Bio / Description */
        .bio {
            font-size: 15px;
            line-height: 1.75;
            color: #e4e6eb;
            margin-bottom: 28px;
        }

        .bio-serif {
            font-family: Georgia, "Times New Roman", Times, serif;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Button */
        .btn-view {
            display: inline-block;
            background-color: #0088cc;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 15px 36px;
            border-radius: 28px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-bottom: 20px;
        }

        .btn-view:hover {
            background-color: #0077b5;
        }

        .btn-view:active {
            transform: scale(0.98);
        }

        /* Preview Channel Link */
        .preview-link {
            display: block;
            color: #7d8b99;
            text-decoration: none;
            font-size: 15px;
            margin-bottom: 26px;
        }

        .preview-link:hover {
            text-decoration: underline;
        }

        /* Footer Text */
        .footer-note {
            font-size: 14px;
            color: #7d8b99;
            line-height: 1.45;
        }

        .footer-note strong {
            color: #9aa7b4;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Top Telegram Header -->

                <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
